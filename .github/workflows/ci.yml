name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ledgerpro_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ledgerpro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ledgerpro_ci?schema=public
      DIRECT_URL: postgresql://ci@localhost:5432/ledgerpro_ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run db:migrate:safety
      - run: npx prisma validate
      - run: npm run db:migrate:deploy
      - run: npm run db:migrate:status
      - run: npm run db:migrate:drift
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Verify reviewed tax lifecycle against Postgres
        run: npx jest __tests__/tax-database.test.ts --runInBand --verbose
        env:
          CI_TAX_DATABASE: '1'
      - run: npm run build
